# Checks for the team branch devel. See AGENTS.md, section 2.
# The job names are the required status checks in the devel ruleset:
# rename them only together with the ruleset.
name: devel checks

on:
  pull_request:
    branches: [devel]
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-files-untouched:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # all branches, so origin/main and the merge base exist

      - name: Only added files compared with main
        run: bash .github/scripts/check_main_files_untouched.sh origin/main HEAD

  jazzy-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the test step needs origin/main to find Tomas's packages

      - name: Install build and test dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --dependency-types buildtool --dependency-types build \
            --dependency-types build_export --dependency-types test

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      # Tomas's packages are built but not tested: their tests are his concern, and
      # without a test directory colcon collects lwa4p_driver/test_move.py (a CLI).
      - name: Test the team's packages
        run: |
          source /opt/ros/jazzy/setup.bash
          # The container user does not own the checkout; actions/checkout trusts it
          # only during its own step.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          main_names="$(bash .github/scripts/main_package_names.sh origin/main HEAD)"
          mapfile -t main_packages < <(grep -v '^$' <<< "${main_names}" || true)
          skip_arguments=()
          if (( ${#main_packages[@]} > 0 )); then
            echo "Not testing Tomas's packages: ${main_packages[*]}"
            skip_arguments=(--packages-skip "${main_packages[@]}")
          fi
          colcon test --event-handlers console_cohesion+ "${skip_arguments[@]}"
          colcon test-result --verbose

  cpp-style:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the scripts need origin/main to find Tomas's packages

      - name: Install clang-format, ament_uncrustify and ament_cpplint
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format-18 \
            ros-jazzy-ament-uncrustify ros-jazzy-ament-cpplint
          # The container user does not own the checkout (see jazzy-build).
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Step 1: the formatter. Its output is the reference, so the fix is one command.
      - name: Formatting (fix with .github/scripts/format_cpp.sh)
        run: |
          source /opt/ros/jazzy/setup.bash
          bash .github/scripts/format_cpp.sh --check origin/main

      # Step 2 runs only on formatted code, so it reports what a formatter cannot fix.
      # Copyright headers are not required (AGENTS.md, section 4).
      - name: cpplint
        run: |
          source /opt/ros/jazzy/setup.bash
          mapfile -d '' -t files < <(bash .github/scripts/team_cpp_files.sh origin/main)
          if (( ${#files[@]} == 0 )); then
            echo "OK: the team's packages have no C/C++ files."
            exit 0
          fi
          ament_cpplint --filters=-legal/copyright "${files[@]}"
